# 단위는 m·rad다. world +X는 전방, +Y는 왼쪽, +Z는 위쪽이다.
# YAML 변경 후 시각화를 재시작한다. 로봇 좌표계·자세는 변경하지 않는다.
frame_id: world
floor_z_m: -1.06801

table:
  enabled: true
  # 앞뒤 깊이·좌우 폭·두께 순서다.
  size_m: [0.76, 1.52, 0.04]
  # 가까운 모서리 윗면 중앙의 world 위치·회전이다.
  position_m: [0.1233, 0.0, -0.367869547836]
  rpy_rad: [0.0, 0.0, 0.0]
  rgba: [0.65, 0.48, 0.30, 1.0]

blind:
  enabled: true
  width_m: 1.52
  height_m: 2.0
  # 표시용 두께다. 실제 천막 두께를 뜻하지 않는다.
  thickness_m: 0.01
  # 책상 먼 모서리와 블라인드 앞면 사이의 간격이다.
  gap_from_table_m: 0.03
  # 책상 방향 기준 추가 이동·회전이다. 기본 아래쪽 끝은 바닥 높이다.
  offset_m: [0.0, 0.0, 0.0]
  rpy_rad: [0.0, 0.0, 0.0]
  rgba: [0.55, 0.60, 0.65, 0.30]

right_wall:
  enabled: true
  # 책상 앞뒤 끝에 맞춘 벽의 길이다.
  length_m: 0.76
  height_m: 2.0
  thickness_m: 0.01
  # 책상 오른쪽 모서리와 벽 안쪽 면 사이의 간격이다.
  gap_from_table_m: 0.10
  # 이동은 책상 방향, 회전은 기본 오른쪽 벽 방향 기준이다.
  offset_m: [0.0, 0.0, 0.0]
  rpy_rad: [0.0, 0.0, 0.0]
  rgba: [0.55, 0.60, 0.65, 0.30]
