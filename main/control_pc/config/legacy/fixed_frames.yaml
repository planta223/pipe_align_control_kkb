# 보존일: 2026-11-10
# 실물 좌표계 정합 미완료. 실제 바닥 기준 수직·수평과의 일치가 확인되지 않은 참조값이다.
# 고정 좌표계 설정이다. xarm_motion은 flange → TCP만 읽는다.
# 위치는 m, 각도는 rad이며 RPY는 Rz(yaw) * Ry(pitch) * Rx(roll)이다.
# parent_T_child는 child 좌표를 parent 좌표로 변환한다.

frames:
  base: world
  left_base: left_robot_base_frame
  # flange·TCP는 시각화 모델에서 추가하는 좌표계 이름이다.
  left_flange: left_flange
  left_tcp: left_tcp
  right_base: right_robot_base_frame
  right_flange: right_flange
  right_tcp: right_tcp
  camera: camera_left_optical_frame

# 위치·TCP는 외부 xarm_params.yaml의 기존 값이다.
# base 회전은 외부 xarm_teleop_params.yaml의 R_world_base다. 실물 비교용 후보값이다.
# 회전행렬은 행 단위이며 base는 기존 코드의 world를 의미한다.
fixed_transforms:
  base_T_left_base:
    translation_m: [-0.07670, 0.05885, -0.06801]
    rotation_matrix:
      - [0.7640235367, 0.6313264797, 0.1330222216]
      - [-0.0301536896, -0.1710100717, 0.9848077530]
      - [0.6444833515, -0.7564274132, -0.1116188970]
  base_T_right_base:
    translation_m: [-0.07670, -0.05885, -0.06801]
    rotation_matrix:
      - [0.7640235367, -0.6313264797, 0.1330222216]
      - [0.0301536896, -0.1710100717, -0.9848077530]
      - [0.6444833515, 0.7564274132, -0.1116188970]
  # 기존 TCP offset의 위치를 mm에서 m로 변환했다.
  left_flange_T_left_tcp:
    translation_m: [0.0, 0.116, 0.116]
    rpy_rad: [0.0, 0.7853, 1.3089969390]
  right_flange_T_right_tcp:
    translation_m: [0.0, 0.116, 0.116]
    rpy_rad: [0.0, 0.7853, 1.3089969390]

# 관절각과 로봇 모델로 계산하며 고정값을 넣지 않는다.
dynamic_transforms:
  left_base_T_left_flange: null
  right_base_T_right_flange: null

# 카메라는 토르소에 고정되어 있다. optical frame까지의 변환은 미확인이다.
# null은 미확인이며 단위행렬이나 영점 오프셋을 의미하지 않는다.
camera_mount:
  parent_frame: base
  parent_T_camera: null
