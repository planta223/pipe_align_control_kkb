# 실행 허용은 아래 값을 파일에서 직접 바꾼 뒤 재시작한다. 실행 옵션으로 덮어쓸 수 없다.
execution:
  standalone_enabled: true
  auto_align_enabled: true
  # step4~7 UVS 시험 이동은 별도 허용한다. vision_measure는 SDK에 연결하지 않는다.
  vision_align_enabled: true

# 모델에 포함된 팔·환경 사이의 경로 여유거리다. 손·파이프 형상은 포함하지 않는다.
pre_align_ready:
  # arm_poses.yaml의 목표 이름. 변경 후 실행기를 다시 시작한다.
  target_pose: pre_align_ready_v2
  collision_margin_m: 0.02
  collision_check_interval_s: 0.05
  collision_minimum_interval_s: 0.0001

robots:
  left:
    ip: "192.168.2.31"
    model1300: false
  right:
    ip: "192.168.2.32"
    model1300: false

# 외부 native Cartesian 제어기의 기본값이다.
limits:
  control_rate_hz: 100.0
  linear_speed_m_s: 0.08
  angular_speed_rad_s: 0.4
  position_tracking_error_m: 0.005
  orientation_tracking_error_rad: 0.1
  # 외부 JointRamp의 계수·주기 상한·추종 오차다.
  joint_speed_coefficient_rad_s: 0.3
  joint_step_dt_cap_s: 0.004
  joint_tracking_error_rad: 0.05
  # init.cc의 25 deg/s²를 새 경로의 가속도 제한에 적용한다.
  joint_acceleration_rad_s2: 0.436332312999

# 아래는 새 제어기에 적용하는 초기값이며 실물 검증 전이다.
validation:
  feedback_timeout_s: 0.1
  # rich 보고는 실측 약 200 ms 주기다. 관절 조회 타임아웃과 분리한다.
  rich_report_timeout_s: 1.0
  start_position_tolerance_m: 0.005
  start_orientation_tolerance_rad: 0.1
  arrival_position_tolerance_m: 0.002
  arrival_orientation_tolerance_rad: 0.02
  arrival_joint_tolerance_rad: 0.005
  stationary_joint_speed_rad_s: 0.01
  arrival_hold_s: 0.3
  arrival_timeout_s: 5.0

# 카메라 외부 캘리브레이션 없이 작은 TCP 시험 이동으로 국소 대응 관계를 추정한다.
# pre_align_ready의 속도와 분리한다. 단위: m, rad, s.
vision_align:
  left_topic: /vision/left_pipe/pose
  right_topic: /vision/right_pipe/pose
  frame_id: camera_left_optical_frame
  pipe_length_m: 0.316
  # CAD 원본 Z=0 / 316 mm 중 실제 마주보는 플랜지. step4 표시로 확인한다.
  left_endpoint_z_m: 0.316
  right_endpoint_z_m: 0.316
  max_pose_age_s: 1.0
  pair_timeout_s: 1.5
  sample_window_s: 0.8
  sample_timeout_s: 8.0
  minimum_samples: 3
  settle_s: 0.2
  angle_tolerance_rad: 0.03490658504
  relative_angle_tolerance_rad: 0.03490658504
  position_tolerance_m: 0.003
  relative_position_tolerance_m: 0.005
  success_hold_s: 1.5
  minimum_success_samples: 5
  max_position_noise_m: 0.0025
  max_angle_noise_rad: 0.01745329252
  probe_translation_m: 0.003
  probe_rotation_rad: 0.02617993878
  max_translation_step_m: 0.002
  max_rotation_step_rad: 0.01745329252
  linear_speed_m_s: 0.005
  angular_speed_rad_s: 0.05
  gain: 0.5
  damping: 0.05
  max_endpoint_travel_m: 0.06
  max_axis_turn_rad: 0.35
  minimum_gap_m: 0.03
  max_gap_change_m: 0.01
  total_timeout_s: 300.0
  max_stage_iterations: 30
  max_moves: 120
  max_worsening: 3
