# 단독 실행은 이 값을 직접 바꾼 뒤 다시 시작한다. 실행 옵션으로 덮어쓸 수 없다.
execution:
  standalone_enabled: true

robots:
  left:
    ip: "192.168.2.31"
    model1300: false
  right:
    ip: "192.168.2.32"
    model1300: false

# 외부 native Cartesian 제어기의 기본값이다.
limits:
  control_rate_hz: 100.0
  linear_speed_m_s: 0.02
  angular_speed_rad_s: 0.2
  position_tracking_error_m: 0.005
  orientation_tracking_error_rad: 0.1
  # 외부 JointRamp의 계수·주기 상한·추종 오차다.
  joint_speed_coefficient_rad_s: 0.2
  joint_step_dt_cap_s: 0.004
  joint_tracking_error_rad: 0.05
  # init.cc의 25 deg/s²를 새 경로의 가속도 제한에 적용한다.
  joint_acceleration_rad_s2: 0.436332312999

# 아래는 새 제어기에 적용하는 초기값이며 실물 검증 전이다.
validation:
  feedback_timeout_s: 0.1
  # rich 보고는 실측 약 200 ms 주기다. 관절 조회 타임아웃과 분리한다.
  rich_report_timeout_s: 1.0
  start_position_tolerance_m: 0.005
  start_orientation_tolerance_rad: 0.1
  arrival_position_tolerance_m: 0.002
  arrival_orientation_tolerance_rad: 0.02
  arrival_joint_tolerance_rad: 0.005
  stationary_joint_speed_rad_s: 0.01
  arrival_hold_s: 0.3
  arrival_timeout_s: 5.0
